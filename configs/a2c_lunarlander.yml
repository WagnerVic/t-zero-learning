# A2C — LunarLander-v3 (extra da atividade).
# Partiu do a2c_cartpole.yml. As mudancas e o porque estao comentados linha a linha.

algorithm: a2c
env_id: LunarLander-v3
seed: 1
cuda: false
total_timesteps: 12000000 # o CartPole resolve em 500k; aqui foram precisos 12M. Com 6M
                          # o agente chega a ~154 e ainda nao pousa de forma confiavel
num_envs: 16              # 8 tambem resolve (215 em 6M); 32 piora, porque com orcamento
                          # fixo de passos o lote maior significa menos atualizacoes

track: true
capture_video: false
save_model: true
checkpoint_every: 0

agent:
  activation: Tanh
  hidden_layers_size: 64

a2c:
  learning_rate: 7.0e-4
  num_steps: 5            # mantido igual ao CartPole. Aumentar para 32 PIORA muito
                          # (-83 contra +98 no mesmo orcamento): com recompensas de -400 a
                          # +250 o retorno de 32 passos tem variancia alta demais para o
                          # critico acompanhar, e a vantagem vira quase o retorno bruto
  gamma: 0.99
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  use_baseline: true
